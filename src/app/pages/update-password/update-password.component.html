<div class="update-password-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'updatePassword.title' | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if(loading) {
        <div class="spinner-container">
          <p>{{ 'updatePassword.updating' | translate }}</p>
        </div>
      }
      <form [formGroup]="updatePasswordForm" (ngSubmit)="updatePassword()">
        <p>{{ 'updatePassword.prompt' | translate }}</p>
        <mat-form-field appearance="fill">
          <mat-label>{{ 'updatePassword.newPassword' | translate }}</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'">
          <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="updatePasswordForm.get('password')?.hasError('minlength')">
            {{ 'updatePassword.minLengthError' | translate }}
          </mat-error>
          <mat-error *ngIf="updatePasswordForm.get('password')?.hasError('required')">
            {{ 'updatePassword.requiredError' | translate }}
          </mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="updatePasswordForm.invalid || loading">{{ 'updatePassword.title' | translate }}</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
