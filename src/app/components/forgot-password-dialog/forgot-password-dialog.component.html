<h1 mat-dialog-title>{{ 'forgotPassword.title' | translate }}</h1>
<div mat-dialog-content>
  <p>{{ 'forgotPassword.prompt' | translate }}</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'login.email' | translate }}</mat-label>
    <input matInput [formControl]="email" type="email" placeholder="hello@example.com">
    <mat-error *ngIf="email.invalid">{{ 'forgotPassword.emailError' | translate }}</mat-error>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'common.cancel' | translate }}</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="email.invalid">{{ 'forgotPassword.sendLink' | translate }}</button>
</div>
