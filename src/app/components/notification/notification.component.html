<div class="notification-overlay">
  <div class="notification-container" [ngClass]="{ 'success': type === 'success', 'error': type === 'error' }">
    <div class="notification-header">
      <h3 class="notification-title">{{ (type === 'success' ? 'common.success' : 'common.error') | translate }}</h3>
      <button class="close-button" (click)="onClose()">×</button>
    </div>
    <div class="notification-body">
      <p>{{ message }}</p>
    </div>
  </div>
</div>
